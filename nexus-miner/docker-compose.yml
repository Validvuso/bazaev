services:
  frontend:
    build: ./frontend
    image: nexus-miner-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    image: nexus-miner-backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/nexusminer
      BOT_TOKEN: ${BOT_TOKEN:-your_telegram_bot_token}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NODE_ENV: production
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: nexusminer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
